name: Rust Mutants

# The test-discrimination instrument for the cli crate: cargo-mutants
# breaks the code in small ways and checks the suite notices.
#
# Weekly + manual dispatch — a measurement run, not a per-PR gate.
# Outcomes land as an artifact; the kill rate is the watched trend.

on:
  workflow_dispatch:
  schedule:
    # weekly, Monday 04:00 UTC — after the controller run
    - cron: '0 4 * * 1'

jobs:
  mutants:
    name: cargo mutants (cli)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked

      - name: Baseline (the suite must be green before breaking it)
        run: cargo test --quiet

      - name: cargo mutants
        run: cargo mutants --output mutants.out

      - name: Upload outcomes
        uses: actions/upload-artifact@v4
        with:
          name: mutants-outcomes
          path: mutants.out/
